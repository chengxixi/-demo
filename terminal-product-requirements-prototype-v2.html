<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终端产品需求管理 · 交互原型</title>
<style>
#terminal-requirements-module{--primary:#3267e9;--primary-soft:#edf3ff;--text:#19243b;--muted:#7c879b;--line:#e8ecf3;--bg:#f6f8fc;--green:#198569;--orange:#c67b23;--red:#d14d57;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.55;padding:32px 36px 20px;box-sizing:border-box}
#terminal-requirements-module *{box-sizing:border-box}
#terminal-requirements-module button,#terminal-requirements-module input,#terminal-requirements-module select,#terminal-requirements-module textarea{font:inherit}
#terminal-requirements-module button{cursor:pointer}
#terminal-requirements-module button:disabled{opacity:.42;cursor:not-allowed}
#terminal-requirements-module :focus-visible{outline:3px solid #a8c2ff;outline-offset:3px}
#terminal-requirements-module h1,#terminal-requirements-module h2,#terminal-requirements-module h3,#terminal-requirements-module p{margin:0}
#terminal-requirements-module .page{max-width:1600px;margin:auto}
#terminal-requirements-module .eyebrow{font-size:11px;letter-spacing:1.4px;color:#8c98ac;font-weight:650;margin-bottom:7px}
#terminal-requirements-module .page-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:27px}
#terminal-requirements-module h1{font-size:26px;letter-spacing:-.7px;font-weight:700;line-height:1.4}
#terminal-requirements-module .page-sub{font-size:13px;color:var(--muted);margin-top:6px}
#terminal-requirements-module .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#terminal-requirements-module .spread{justify-content:space-between}
#terminal-requirements-module .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:8px 13px;border:1px solid #dfe5ef;border-radius:7px;background:#fff;color:#46536c;font-size:13px;white-space:nowrap;line-height:1.35;transition:background .12s}
#terminal-requirements-module .btn:hover{background:#f6f8fd}
#terminal-requirements-module .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 8px #3267e91c}
#terminal-requirements-module .btn.primary:hover{background:#2458d4}
#terminal-requirements-module .btn.danger{color:var(--red);border-color:#f0ced1}
#terminal-requirements-module .btn.small{padding:5px 9px;min-height:29px;font-size:12px}
#terminal-requirements-module .btn.quiet{border-color:transparent;background:transparent}
#terminal-requirements-module .btn.quiet:hover{background:#edf2fa}
#terminal-requirements-module .link{background:none;border:0;color:var(--primary);padding:0;text-align:left;font:inherit;cursor:pointer;text-decoration:none}
#terminal-requirements-module .link:hover{text-decoration:underline}
#terminal-requirements-module .icon{display:inline-flex;flex:none;vertical-align:middle}
#terminal-requirements-module .icon svg{width:18px;height:18px}
#terminal-requirements-module .icon.large svg{width:22px;height:22px}
#terminal-requirements-module .demo-tag{display:inline-flex;align-items:center;gap:6px;border-radius:5px;background:#eaf0f8;color:#8190a5;font-size:11px;letter-spacing:.5px;padding:4px 7px}
#terminal-requirements-module .stats{display:grid;grid-template-columns:repeat(4,minmax(max-content,1fr));gap:10px;margin-bottom:16px;overflow-x:auto}
#terminal-requirements-module .stat{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;text-align:left;white-space:nowrap;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--text);box-shadow:0 2px 5px #23375903;transition:box-shadow .15s,border-color .15s}
#terminal-requirements-module .stat:hover,#terminal-requirements-module .stat.selected{border-color:#adcbff;box-shadow:0 3px 14px #3267e90c}
#terminal-requirements-module .stat-label{color:#738098;font-size:13px;flex:none}
#terminal-requirements-module .stat-value{display:inline-flex;align-items:baseline;gap:3px;margin-left:auto}
#terminal-requirements-module .stat-value strong{font-size:20px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
#terminal-requirements-module .stat-value small{font-size:11px;font-weight:400;color:#99a3b4}
#terminal-requirements-module .stat-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;background:#eff4ff;color:#648be9;border-radius:6px}
#terminal-requirements-module .stat-icon.amber{background:#fff5e8;color:#dca35b}
#terminal-requirements-module .stat-icon.violet{background:#f2effc;color:#9a84da}
#terminal-requirements-module .stat-icon.rose{background:#fff0f1;color:#dd8793}
#terminal-requirements-module .board{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:0 4px 18px #21314f03;overflow:hidden}
#terminal-requirements-module .tabs-bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 22px;gap:14px;overflow-x:auto}
#terminal-requirements-module .tabs{display:flex;align-items:center;gap:26px;min-width:max-content}
#terminal-requirements-module .tab{display:flex;align-items:center;gap:7px;border:0;border-bottom:2px solid transparent;padding:18px 0 15px;background:transparent;color:#7a8597;font-weight:500;white-space:nowrap}
#terminal-requirements-module .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:650}
#terminal-requirements-module .count{font-size:10px;padding:1px 6px;border-radius:4px;background:#f0f3f8;color:#91a0b5;line-height:1.6}
#terminal-requirements-module .tab.active .count{background:#eaf1ff;color:var(--primary)}
#terminal-requirements-module .toolbar{padding:18px 22px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
#terminal-requirements-module .search{display:flex;align-items:center;gap:8px;width:260px;min-height:36px;border:1px solid #e4e9f1;border-radius:6px;padding:0 10px;color:#9ca7b8;background:#fff}
#terminal-requirements-module .search input{border:0;outline:0;width:100%;height:34px;font-size:12px;color:var(--text);background:transparent}
#terminal-requirements-module .search input::placeholder{color:#a5afbf}
#terminal-requirements-module .filter{max-width:170px;min-width:120px;height:36px;border:1px solid #e4e9f1;border-radius:6px;padding:0 27px 0 10px;font-size:12px;color:#6c7890;background:#fff}
#terminal-requirements-module .toolbar-tail{margin-left:auto;color:#8b97aa;font-size:12px}
#terminal-requirements-module .active-filter{padding:0 22px 13px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
#terminal-requirements-module .table-wrap{overflow:auto;max-width:100%}
#terminal-requirements-module table{width:100%;border-collapse:collapse;min-width:880px;text-align:left}
#terminal-requirements-module th{height:42px;background:#f9fafc;color:#8b97a9;font-size:11px;font-weight:500;border-top:1px solid #f0f2f7;border-bottom:1px solid var(--line);padding:11px 16px;white-space:nowrap}
#terminal-requirements-module td{padding:17px 16px;border-bottom:1px solid #f0f2f7;vertical-align:middle;font-size:12px;color:#5b6880}
#terminal-requirements-module th:first-child,#terminal-requirements-module td:first-child{padding-left:23px}
#terminal-requirements-module tbody tr:hover{background:#fbfcff}
#terminal-requirements-module tr.selected-row{background:#f1f6ff}
#terminal-requirements-module tbody tr:last-child td{border-bottom:0}
#terminal-requirements-module .title-cell{display:flex;align-items:flex-start;gap:11px;min-width:240px;max-width:420px}
#terminal-requirements-module .type-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#f1f5fd;color:#7b9acf;flex:none;margin-top:2px}
#terminal-requirements-module .title-link{border:0;background:transparent;text-align:left;padding:0;color:#344159;font-weight:550;font-size:13px;line-height:1.6;cursor:pointer}
#terminal-requirements-module .title-link:hover{color:var(--primary)}
#terminal-requirements-module .meta{font-size:11px;color:#9aa5b6;margin-top:4px;line-height:1.6}
#terminal-requirements-module .nowrap{white-space:nowrap}
#terminal-requirements-module .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;color:#6b7891;background:#f1f4f9;font-size:11px;font-weight:450;line-height:1.5;white-space:nowrap}
#terminal-requirements-module .badge.blue{color:#4972ce;background:#edf3ff}
#terminal-requirements-module .badge.green{color:#398a75;background:#eaf7f1}
#terminal-requirements-module .badge.orange{color:#b68339;background:#fff5e5}
#terminal-requirements-module .badge.red{color:#c0646c;background:#fff0f1}
#terminal-requirements-module .badge.purple{color:#8a71bf;background:#f3effb}
#terminal-requirements-module .avatar{width:23px;height:23px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#edf1fa;color:#788bb2;font-size:10px;margin-right:6px}
#terminal-requirements-module .priority{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#terminal-requirements-module .dot{width:6px;height:6px;border-radius:50%;background:#9eafc7;display:inline-block}
#terminal-requirements-module .dot.high{background:#e6a152}
#terminal-requirements-module .dot.urgent{background:#dc737e}
#terminal-requirements-module .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line);color:#9ba5b6;font-size:11px}
#terminal-requirements-module .page-note{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:17px;color:#a2acbc;font-size:11px}
#terminal-requirements-module .empty{padding:65px 20px;text-align:center;color:var(--muted)}
#terminal-requirements-module .empty .icon{color:#b5c3db;margin-bottom:12px}
#terminal-requirements-module .empty strong{display:block;color:#66748e;font-size:14px;margin-bottom:5px;font-weight:550}
#terminal-requirements-module input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px;cursor:pointer;vertical-align:middle}
#terminal-requirements-module dialog{color:var(--text);font:inherit}
#terminal-requirements-module dialog::backdrop{background:#12234636;backdrop-filter:blur(1px)}
#terminal-requirements-module .drawer{width:min(1080px,calc(100vw - 64px));max-width:none;height:100dvh;max-height:none;margin:0 0 0 auto;padding:0;border:0;border-left:1px solid var(--line);box-shadow:-14px 0 55px #18315d15;background:#f7f9fc}
#terminal-requirements-module .drawer[open]{display:flex;flex-direction:column}
#terminal-requirements-module .drawer-head{padding:23px 28px 19px;background:#fff;border-bottom:1px solid var(--line);flex:none}
#terminal-requirements-module .drawer h2{font-size:21px;font-weight:650;line-height:1.45;max-width:830px}
#terminal-requirements-module .close{padding:6px;background:transparent;border:0;color:#8a97ab;display:inline-flex;border-radius:5px}
#terminal-requirements-module .close:hover{background:#edf1f9;color:#526480}
#terminal-requirements-module .drawer-nav{background:#fff;display:flex;gap:25px;padding:0 28px;border-bottom:1px solid var(--line);flex:none;overflow:auto}
#terminal-requirements-module .drawer-body{overflow:auto;flex:1;padding:24px 28px}
#terminal-requirements-module .drawer-actions{padding:14px 28px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
#terminal-requirements-module .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
#terminal-requirements-module .card h3{font-size:14px;font-weight:650;margin-bottom:14px}
#terminal-requirements-module .card .table-wrap{margin:10px -20px -20px}
#terminal-requirements-module .card table{min-width:620px}
#terminal-requirements-module .card td{padding:13px 15px}
#terminal-requirements-module .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#terminal-requirements-module .kv{display:grid;grid-template-columns:110px 1fr;gap:12px 15px;font-size:13px}
#terminal-requirements-module .kv dt{color:#929caf;margin:0}
#terminal-requirements-module .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
#terminal-requirements-module .paragraph{white-space:pre-wrap;color:#59677f;font-size:13px;line-height:1.85;overflow-wrap:anywhere}
#terminal-requirements-module .muted{color:var(--muted);font-size:12px}
#terminal-requirements-module .notice{display:flex;gap:9px;padding:12px 14px;border-radius:6px;background:#eff5ff;border:1px solid #e0eaff;color:#5775a4;font-size:12px;margin-bottom:15px;align-items:flex-start}
#terminal-requirements-module .notice.warn{background:#fff9ed;border-color:#f5e8cd;color:#a08043}
#terminal-requirements-module .notice.error{background:#fff2f3;border-color:#f4dce0;color:#ad6570}
#terminal-requirements-module .notice.success{background:#edf8f3;border-color:#d9eee4;color:#528b74}
#terminal-requirements-module .gate-track{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:21px}
#terminal-requirements-module .gate{background:white;border:1px solid var(--line);border-radius:8px;padding:15px;display:flex;align-items:center;gap:10px;text-align:left}
#terminal-requirements-module .gate.active{border-color:#92b5fc;background:#f4f8ff}
#terminal-requirements-module .gate-num{width:28px;height:28px;border-radius:50%;background:#f0f3f9;color:#8b99af;display:grid;place-items:center;font-size:12px;flex:none}
#terminal-requirements-module .gate.passed .gate-num{background:#e5f4ee;color:#4c937a}
#terminal-requirements-module .gate.active .gate-num{background:var(--primary);color:white}
#terminal-requirements-module .gate strong{font-size:12px;font-weight:600;display:block}
#terminal-requirements-module .timeline{border-left:1px solid #e4eaf3;margin:10px 5px;padding-left:20px}
#terminal-requirements-module .timeline-item{position:relative;padding-bottom:20px;font-size:12px}
#terminal-requirements-module .timeline-item:before{content:"";position:absolute;left:-24px;top:6px;width:7px;height:7px;border:2px solid #c7d6ee;border-radius:50%;background:white}
#terminal-requirements-module .timeline-item strong{font-size:12px;font-weight:550}
#terminal-requirements-module .modal{width:min(790px,calc(100vw - 36px));max-width:none;max-height:90dvh;border:1px solid #e4eaf3;border-radius:13px;padding:0;box-shadow:0 18px 80px #192b4c26}
#terminal-requirements-module .modal[open]{display:flex;flex-direction:column}
#terminal-requirements-module .modal-head{padding:20px 24px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex:none}
#terminal-requirements-module .modal h2{font-size:18px;font-weight:650}
#terminal-requirements-module .modal-body{padding:22px 24px;overflow:auto;min-height:0}
#terminal-requirements-module .modal-actions{padding:15px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fff;flex:none}
#terminal-requirements-module .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;min-width:0}
#terminal-requirements-module .field label{font-size:12px;color:#66738b;font-weight:500}
#terminal-requirements-module .required{color:#d2858e;margin-left:3px}
#terminal-requirements-module .field input:not([type=checkbox]),#terminal-requirements-module .field select,#terminal-requirements-module .field textarea{width:100%;border:1px solid #dee5ef;border-radius:6px;padding:9px 11px;background:#fff;color:#34425b;min-height:38px;font-size:13px}
#terminal-requirements-module .field textarea{min-height:82px;resize:vertical}
#terminal-requirements-module .field input:focus,#terminal-requirements-module .field select:focus,#terminal-requirements-module .field textarea:focus{border-color:#8caef3;outline:2px solid #edf3ff}
#terminal-requirements-module .field small{color:#98a3b5;font-size:11px}
#terminal-requirements-module .check-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#66758c;margin:8px 0}
#terminal-requirements-module .select-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:9px}
#terminal-requirements-module .select-card.disabled{opacity:.55;background:#f8fafc}
#terminal-requirements-module .steps{display:flex;gap:7px;margin:0 0 20px}
#terminal-requirements-module .step{flex:1;border-bottom:2px solid #e9eef7;padding:0 0 10px;color:#a0aabc;font-size:11px}
#terminal-requirements-module .step.current{color:var(--primary);border-color:var(--primary)}
#terminal-requirements-module .form-error{color:#be5864;background:#fff1f3;border-radius:6px;padding:10px 13px;font-size:12px;margin:12px 0}
#terminal-requirements-module .doc-preview{border:1px solid #e3e9f2;background:white;border-radius:7px;padding:30px;box-shadow:0 4px 13px #233a5d05}
#terminal-requirements-module .doc-preview h3{font-size:20px;margin:8px 0 25px}
#terminal-requirements-module .doc-preview h4{font-size:13px;margin:20px 0 8px}
#terminal-requirements-module .doc-preview p{font-size:13px;color:#7b879a;line-height:1.9}
#terminal-requirements-module .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:10000;background:#253551;color:#fff;border-radius:8px;padding:12px 19px;box-shadow:0 5px 20px #132b5126;font-size:13px;max-width:90vw;pointer-events:none}
#terminal-requirements-module .checklist{display:flex;flex-direction:column;gap:8px}
#terminal-requirements-module .checklist-item{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:6px;padding:12px 13px;font-size:12px}
#terminal-requirements-module .mini-strip{display:flex;gap:4px;align-items:center;margin-top:6px}
#terminal-requirements-module .mini-step{width:24px;height:3px;border-radius:2px;background:#e9eef7}
#terminal-requirements-module .mini-step.done{background:#70bca3}
#terminal-requirements-module .mini-step.current{background:#6d96ed}
#terminal-requirements-module .source-note{padding:13px;border-left:3px solid #d7e2f4;background:#f8faff;font-size:13px;line-height:1.85;white-space:pre-wrap}
#terminal-requirements-module .spacer{flex:1}
#terminal-requirements-module .grow{flex:1;min-width:0}
#terminal-requirements-module .end{justify-content:flex-end}
#terminal-requirements-module .right{text-align:right}
#terminal-requirements-module .indent{margin-left:43px}
#terminal-requirements-module .span2{grid-column:1/-1}
#terminal-requirements-module .text-orange{color:var(--orange)}
#terminal-requirements-module .dot.orange{background:#e6a152}
#terminal-requirements-module .dot.blue{background:#7ba0df}
#terminal-requirements-module .type-icon.purple{background:#f3effb;color:#9b86c7}
#terminal-requirements-module .meta span{padding:0 5px}
#terminal-requirements-module .stat.active{border-color:#a0bdf8;background:#fcfdff}
#terminal-requirements-module .stat-icon.orange{background:#fff5e8;color:#d49a50}
#terminal-requirements-module .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:16px}
#terminal-requirements-module .section-head h3{margin-bottom:5px}
#terminal-requirements-module .kv{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;font-size:13px;margin:15px 0 20px}
#terminal-requirements-module .kv dt{font-size:11px;margin-bottom:5px}
#terminal-requirements-module .notice{display:block;line-height:1.8;overflow-wrap:anywhere}
#terminal-requirements-module .notice .btn{margin-top:8px}
#terminal-requirements-module .notice>.icon{margin-right:5px}
#terminal-requirements-module .card .paragraph{margin:8px 0 14px}
#terminal-requirements-module blockquote{margin:14px 0;padding:12px 15px;border-left:3px solid #d5e2f5;background:#f9fbff}
#terminal-requirements-module .icon-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#8c98ab;padding:5px;border-radius:5px}
#terminal-requirements-module .icon-btn:hover{background:#edf2fa;color:#4b638e}
#terminal-requirements-module .drawer-head h2{margin:13px 0 10px}
#terminal-requirements-module .drawer-nav button{border:0;border-bottom:2px solid transparent;background:transparent;padding:15px 0;color:#7b879b;white-space:nowrap;font-size:13px}
#terminal-requirements-module .drawer-nav button.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
#terminal-requirements-module .gate small{display:block;font-size:11px;color:#8e9bae;margin-top:3px}
#terminal-requirements-module .gate-num.done{background:#e5f4ee;color:#4c937a}
#terminal-requirements-module .review-row{padding:15px 0;border-bottom:1px solid var(--line)}
#terminal-requirements-module .review-row:last-child{border-bottom:0;padding-bottom:0}
#terminal-requirements-module .checklist-item{margin-bottom:9px}
#terminal-requirements-module .external-id{display:flex;align-items:center;gap:10px;margin:17px 0;font-size:16px;color:#425675}
#terminal-requirements-module .mini-strip>span{width:25px;height:3px;background:#e8edf6;border-radius:2px}
#terminal-requirements-module .mini-strip>span.done{background:#70bca3}
#terminal-requirements-module .mini-strip>span.current{background:#6d96ed}
#terminal-requirements-module .modal>form{display:flex;flex-direction:column;max-height:90dvh;min-height:0}
#terminal-requirements-module .modal-body{flex:1}
#terminal-requirements-module .field>span:first-child{font-size:12px;color:#63718a}
#terminal-requirements-module .field-hint{font-size:11px;color:#929eb2;margin-top:-5px;margin-bottom:15px}
#terminal-requirements-module select option:disabled{color:#aeb6c3;background:#f1f3f6}
#terminal-requirements-module .source-legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:-5px;margin-bottom:14px}
#terminal-requirements-module .source-chip{font-size:10px;padding:3px 7px;border-radius:999px;background:#edf8f4;color:#39816d;border:1px solid #cde8df}
#terminal-requirements-module .source-chip.off{background:#f2f4f7;color:#9aa4b2;border-color:#e0e4ea;text-decoration:line-through}
#terminal-requirements-module .select-card:has(input:disabled){opacity:.55;background:#f8fafc}
#terminal-requirements-module .select-card.selected{border-color:#bed0f7;background:#f8fbff}
#terminal-requirements-module .select-card .meta{display:block}

<!-- 单页可嵌入原型。业务依据：终端产品需求管理池沟通确认稿（2026-11-01）。所有资料、人员与跨系统操作均为本地演示。 -->
<main id="terminal-requirements-module">
  <div class="page">
    <header class="page-head">
      <div><div class="eyebrow">产品线经理工作台</div><h1>终端产品需求管理</h1><p class="page-sub">统一管理产品需求、开发方案、事务承接与评审变更</p></div>
      <div class="row"><span class="demo-tag">交互原型 · 演示数据</span><button class="btn primary" data-action="create"><span data-icon="Plus"></span>新建需求</button></div>
    </header>
    <div class="notice" style="margin-bottom:14px"><strong>已确认的跨系统去向：</strong>反馈系统选择“转产品需求 / 转产品规划 / 转事务处理”，不以“关闭”代替流转。仅“转产品需求”同步进入本需求池并持续回写状态；品牌规划在线下确认后，由品牌经理或产品经理再次手动录入。</div>
    <section class="stats" id="stats" aria-label="需求处理提醒"></section>
    <section class="board">
      <div class="tabs-bar"><nav class="tabs" id="main-tabs" aria-label="页内视图"></nav><span class="muted nowrap" id="scope-label"></span></div>
      <div class="toolbar" id="toolbar"></div>
      <div id="filter-note"></div>
      <div class="table-wrap" id="main-list"></div>
      <footer class="footer" id="list-footer"></footer>
    </section>
    <div class="page-note"><span>所有演示操作仅保存在当前浏览器 · 资料与外部同步均为模拟</span><button class="link" data-action="reset" style="font-size:11px;color:#98a4b7">重置演示数据</button></div>
  </div>
  <dialog id="detail-drawer" class="drawer" aria-label="业务详情"></dialog>
  <dialog id="business-dialog" class="modal" aria-label="业务操作"></dialog>
  <dialog id="priority-dialog" class="modal" aria-label="需求等级说明"></dialog>
  <div id="toast-host" aria-live="polite"></div>
</main>

 return (editing?'':field((optimization?'产品优化':'其他')+'需求名称 *','title',v.title,'text','required maxlength="100"'))+
 '<div class="grid2">'+ownerFields(v)+sel(optimization?'待优化产品 *':'关联产品（可选）','product',productOptions(v.product,optimization?'请选择现有产品':'不关联具体产品'),optimization?'required':'')+
 (optimization?sel('优化方向','optimizationArea',options(OPTIMIZATION_AREAS,v.optimizationArea||'experience')):'')+
  field('承接部门（可后补）','department',v.department??v.localProgress?.department)+field('期望完成时间','desired',v.desired,'date')+demandLevelField(v)+'</div>'+
 area(optimization?'当前问题与影响 *':'背景与具体诉求 *',editing?'analysis':'description',editing?v.analysis:v.description,'required')+
 area(optimization?'优化目标与处理范围 *':'处理目标与边界 *','scope',v.scope,'required')+
 area(optimization?'优化验收标准 *':'完成标准 *','acceptance',v.acceptance,'required')+
 (editing?area('调整原因 *','reason',v.reason,'required'):area('佐证材料 / 证据说明','evidence',v.evidence));
}
function demandDetailFields(v){

function renderGroup(m){

  out+='<p class="muted">可选择反馈需求、产品优化或其他需求。归包后保留原编号、来源和分配前内容；已归包需求请使用“调整归属”。</p><div class="selection-list">'+state.requirements.filter(r=>r.kind!=='transaction').map(r=>'<label class="select-card '+(m.ids.includes(r.id)?'selected':'')+'"><input type="checkbox" name="pick_'+r.id+'" '+(m.ids.includes(r.id)?'checked ':'')+(!canJoinPackage(r)?'disabled':'')+'><span class="grow"><strong>'+e(r.title)+'</strong><span class="meta">'+e(r.id)+' · '+e(kindLabel(r))+' · '+e(sourceLabel(r))+' · '+e(lineName(r.line))+'</span></span><span>'+(pendingMembership(r.id)?badge('归属变更待确认','orange'):r.packageId?badge('已归属 '+r.packageId):['hold','closed'].includes(r.status)?statusBadge(r.status):badge('可纳入','blue'))+'</span></label>').join('')+'</div>';

  out+=sel('归包方式','targetMode',options({new:'新建开发需求包',existing:'归入已有需求包'},m.targetMode),'data-dynamic="targetMode"');
  if(m.targetMode==='existing')out+=sel('选择目标需求包 *','targetId',options(Object.fromEntries(state.packages.filter(p=>['active','draft'].includes(p.status)).map(p=>[p.id,p.id+' · '+p.title+' · '+kindLabel(p)])),m.targetId,'请选择'),'required')+'<div class="notice">若目标包已有通过的关口，提交后先形成范围变更，确认前保留原批准范围。</div>';

  m.ids.forEach(id=>{const r=reqById(id),s=m.scopes[id]||{scope:r.scope,acceptance:r.acceptance};out+='<section class="card"><h3>'+e(r.id)+' · '+e(r.title)+'</h3>'+area('本次纳入范围 *','scope_'+id,s.scope,'required')+area('验收要求 *','acceptance_'+id,s.acceptance,'required')+'</section>'});
  const reviewed=m.targetMode==='existing'&&pkgById(m.targetId)?.gates.some(g=>g.status==='passed');
  out+=area(reviewed?'范围变更原因及影响 *':'分配原因 *','reason',v.reason,reviewed?'required placeholder="说明对功能、成本、周期、技术和验收的影响"':'required placeholder="说明为何将这些需求纳入本次开发"');

 }else{

  m.ids.map(id=>'<div class="notice"><strong>'+e(id)+' · '+e(reqById(id).title)+'</strong><p class="paragraph">'+e(m.scopes[id].scope)+'</p><div class="meta">验收：'+e(m.scopes[id].acceptance)+'</div></div>').join('')+

 }

   const round=startReview(p,Number(m.gate),{organizer:data.organizer,participants});next={type:'review',id:round.id};message='评审已发起，送审快照已锁定';
  }else if(m.kind==='opinion'){
   if(review.status!=='reviewing')fail('本轮已结束，请使用补充 / 更正记录');
   review.notes.push({actor:data.actor,text:requireText(data.text,'评审意见'),at:stamp()});audit('package',review.packageId,'记录评审意见',review.id+' · '+userName(data.actor));
  }else if(m.kind==='conclusion'){
   if(review.status!=='reviewing')fail('本轮已定稿，不能覆盖原结论');
   requireText(data.summary,'结论依据');const outcome=data.conclusion;
   if(['conditional','rework'].includes(outcome)){requireText(data.condition,'整改事项');requireText(data.due,'整改期限');requireText(data.block,'阻塞范围')}
   review.conclusion={passed:'通过',conditional:'有条件通过',rework:'补充后复审',rejected:'不通过'}[outcome];review.summary=data.summary;review.confirmer=data.confirmer;review.finishedAt=stamp();
   if(['conditional','rework'].includes(outcome))review.conditions.push({text:data.condition,owner:data.conditionOwner,due:data.due,block:data.block,done:false,evidence:''});
   const pack=pkgById(review.packageId);
   if(outcome==='passed')confirmPass(pack,review);
   else{review.status=outcome;pack.gates[review.gate].status=outcome;audit('package',pack.id,'记录'+GATES[review.gate]+'结论',review.conclusion+' · '+data.summary)}
   message=outcome==='conditional'?'有条件通过已记录，完成条件前不会放行或同步':'评审结论已保存';
  }else if(m.kind==='condition'){
   const c=review.conditions[Number(m.index)];c.evidence=requireText(data.evidence,'完成证据');c.done=true;c.completedAt=stamp();audit('package',review.packageId,'登记整改完成',review.id+' · '+c.text);
  }else if(m.kind==='release'){
   if(review.status!=='conditional')fail('当前轮次不是有条件通过');if(review.conditions.some(c=>!c.done))fail('仍有未完成的整改条件，暂不能放行');
   review.release={actor:data.confirmer,evidence:requireText(data.evidence,'确认依据'),at:stamp()};review.confirmer=data.confirmer;confirmPass(pkgById(review.packageId),review);message='放行条件已确认，评审通过';
  }else if(m.kind==='withdraw'){
   if(!['reviewing','conditional'].includes(review.status))fail('当前轮次已结束');review.withdrawReason=requireText(data.reason,'撤回原因');review.status='withdrawn';review.finishedAt=stamp();pkgById(review.packageId).gates[review.gate].status='withdrawn';audit('package',review.packageId,'撤回评审',review.id+' · '+data.reason);
  }else if(m.kind==='correction'){review.corrections=review.corrections||[];review.corrections.push({text:requireText(data.text,'补充内容'),actor:CONTEXT.currentUser,at:stamp()});audit('package',review.packageId,'补充更正评审记录',review.id+'；保留原结论')}
  else if(m.kind==='freeze'){
   if(p.gates[2].status!=='passed')fail('立项评审通过后才能冻结');if(p.status!=='active')fail('请先恢复需求包');
   if(!data.coreConfirmed)fail('请确认所有核心需求已经明确');if(!members(p).length||members(p).some(x=>!x.acceptance.trim()||!x.scope.trim()))fail('存在未明确的需求范围或验收要求，请先补充');
   if(state.changes.some(c=>c.status==='pending'&&(c.packageId===p.id||c.targetId===p.id)))fail('请先处理待确认范围变更');
   if(data.deferred){requireText(data.deferredDue,'后移事项完成日期');requireText(data.deferredImpact,'后移边界与受影响动作')}
   if(p.baseline)p.baselineHistory.push(clone(p.baseline));
   const passedReview=state.reviews.filter(x=>x.packageId===p.id&&x.gate===2&&x.status==='passed').at(-1);if(!passedReview)fail('未找到已通过的立项评审');
   p.baseline={id:uid('BASE'),version:p.version,at:stamp(),actor:CONTEXT.currentUser,snapshot:clone(passedReview.snapshot),deferred:[],source:'立项评审'};
   audit('package',p.id,'补建立项冻结基线',p.baseline.id+' · V'+p.version);syncPackage(p.id,'baseline');message='立项冻结基线已补建';
  }else if(m.kind==='move'){
   requestMembership(data.operation==='transfer'?data.targetId:'',[r.id],{},data.operation,r.packageId,requireText(data.reason,'调整原因'),data.impact);message='归属调整已记录；已批准的范围需确认变更';
  }else if(m.kind==='confirm-change'){
   const c=state.changes.find(x=>x.id===m.id);const evidence=requireText(data.evidence,'变更确认依据');confirmChange(m.id);c.confirmationEvidence=evidence;message='新版本已生成，请完成受影响关口复审';
  }else if(m.kind==='lifecycle'){saveLifecycle(m,data);message='状态已更新，原因与历史已保留'}
  else if(m.kind==='local-progress'){
   if(!isLocalRequirement(r)||r.packageId)fail('此操作仅适用于独立的产品优化和其他需求');
   if(pendingMembership(r.id))fail('请先确认或取消待处理的归属变更');
   if(['hold','closed'].includes(r.status))fail('请先恢复或重新开启需求');
   const department=requireText(data.department,'承接部门'),owner=requireText(data.owner,'处理负责人'),due=requireText(data.due,'完成期限');
   if(!LOCAL_PROGRESS[data.localStatus])fail('请选择有效的池内处理进度');
   const completed=data.localStatus==='已完成';if(completed){requireText(data.result,'验收结果与完成证据');requireText(r.acceptance,'完成标准')}
   r.localProgress={department,status:data.localStatus,result:data.result||'',updatedAt:stamp()};r.desired=due;r.fulfilled=completed;r.status=completed?'closed':'active';
   if(r.owner!==owner)assign(r,owner,'需求池内处理负责人调整');
   if(completed){r.closeReason='已实现';r.closeNote=data.result;r.acceptanceEvidence=data.result;r.acceptedBy=CONTEXT.currentUser;r.acceptedAt=stamp()}
   audit('requirement',r.id,completed?'验收完成并关闭':'更新处理进展',department+' · '+data.localStatus+' · '+(data.result||'等待处理'));
   message=completed?'需求已验收闭环，完成证据已保存':'需求处理进展已更新';
  }
  else if(m.kind==='transaction'){
   message=saveTransaction(r,v);
  }else if(m.kind==='tx-accept'){
   if(!r||r.kind!=='transaction'||r.transactionPackageId)fail('仅单条待验收事务可在此验收');const t=r.transaction||{};if(t.status!=='待验收')fail('当前事务不是待验收状态');const note=requireText(data.acceptanceNote,'验收意见与依据'),passed=data.acceptanceResult==='passed';if(!['passed','rejected'].includes(data.acceptanceResult))fail('请选择验收结论');
   t.acceptance={result:passed?'通过':'不通过',note,actor:CONTEXT.currentUser,at:stamp()};t.status=passed?'已完成':'开发中';t.result=passed?note:'验收不通过：'+note;t.actualEnd=passed?stamp():'';r.status=passed?'closed':'active';r.fulfilled=passed;r.acceptedBy=passed?CONTEXT.currentUser:'';r.acceptedAt=passed?stamp():'';audit('requirement',r.id,passed?'事务验收通过':'事务验收不通过并退回开发中',note);message=passed?'验收通过，事务已完成':'验收不通过，事务已退回开发中';next={type:'requirement',id:r.id};
  }else if(m.kind==='tx-version'){
   if(!r||r.kind!=='transaction'||r.transactionPackageId)fail('仅单条 POM 事务可以升级需求版本');const t=r.transaction||{};if(!['待承接','开发中','待验收'].includes(t.status))fail('只有待承接、开发中或待验收的事务可以升级需求版本');
   const name=requireText(v.planningName,'新版本需求名称'),content=requireText(v.planningContent,'新版本需求内容'),reason=requireText(v.reason,'版本升级原因');if(name===(t.planningName||r.title)&&content===(t.planningContent||r.description||r.scope||''))fail('需求名称和内容未发生变化，无需升级版本');
   const current=t.currentVersion||1;t.versions=t.versions||[];if(!t.versions.some(x=>x.version===current))t.versions.push({version:current,name:t.planningName||r.title,content:t.planningContent||r.description||r.scope||'',at:stamp(),actor:CONTEXT.currentUser,reason:'历史版本补录'});
   const nextVersion=current+1;t.currentVersion=nextVersion;t.planningName=name;t.planningContent=content;t.versions.push({version:nextVersion,name,content,at:stamp(),actor:CONTEXT.currentUser,reason});if(t.pomId){t.transactionName=name;t.pomSyncStatus='同步成功';state.syncLogs.push({id:uid('SYNC'),requirementId:r.id,target:'pom',op:'update-version',status:'success',at:stamp(),detail:'POM 需求版本更新为 V'+nextVersion+'：'+name})}audit('requirement',r.id,'升级 POM 需求版本','V'+current+' → V'+nextVersion+'；'+reason);message='已生成 POM 需求版本 V'+nextVersion+'，旧版本继续保留';next={type:'requirement',id:r.id};
   }else if(m.kind==='project-progress'){
    const pr=p.external.project;if(!['initiated','doing','complete','production'].includes(pr.status))fail('项目成功立项后才能回传开发状态');
    if(pr.status==='production'&&data.projectStatus!=='production')fail('项目已转量，不能在需求池回退状态');
    if(pr.status==='complete'&&!['complete','production'].includes(data.projectStatus))fail('已完成项目的重新执行应通过范围变更及重新立项确认');
   pr.status=data.projectStatus;pr.planned=data.planned||pr.planned;pr.progressNote=requireText(data.note,'回传进展');pr.lastSuccess=stamp();p.external.plan.projectStatus=pr.status;
   state.syncLogs.push({id:uid('SYNC'),packageId:p.id,target:'project',op:'progress',status:'success',at:stamp(),detail:'回传 '+PROJECT_STATUS[pr.status]+'：'+data.note});audit('package',p.id,'项目状态回传',PROJECT_STATUS[pr.status]+' · '+data.note);message=pr.status==='complete'?'项目已完成，请逐项验收需求':'项目进展已更新';
  }else if(m.kind==='accept'){
   const pp=pkgById(r.packageId);if(!pp||pp.external.project?.status!=='complete')fail('等待项目完成后再确认实现');if(pp.status!=='active')fail('请先恢复需求包');
   r.acceptanceEvidence=requireText(data.evidence,'验收证据');r.fulfilled=true;r.acceptedBy=CONTEXT.currentUser;r.acceptedAt=stamp();audit('requirement',r.id,'确认需求实现',data.evidence);audit('package',pp.id,'需求明细验收',r.id+' · '+data.evidence);message='已确认该条需求实现';
  }else if(m.kind==='reset'){
   if(!data.confirmed)fail('请勾选确认重置');state=seed();storageIssue=false;view.selected.clear();view.txSelected.clear();view.search='';view.line='';view.owner='';view.source='';view.status='';view.kind='';view.gate='';view.taskFilter='';view.tab='todo';view.page=1;closeDetail();message='演示数据已恢复';
  }
  closeModal();commit();if(next)openDetail(next.type,next.id,next.tab);toast(message);
 }catch(err){formError(err.message)}
}
function dynamicForm(el){
 const m=view.modal;if(!m)return;const values=readForm();m.values={...m.values,...values};
 if(el.dataset.dynamic==='line'){if(m.values.assignment!=='manual')m.values.owner=lineOwner(values.line)}
 if(el.dataset.dynamic==='owner')m.values.assignment='manual';
 if(el.dataset.dynamic==='targetMode')m.targetMode=values.targetMode;
 if(el.dataset.dynamic==='createScene'){m.values.createType='new';m.values.product='';m.values.currentVersion='';m.values.targetVersion=values.createScene==='package'?'V1.0':''}
 if(el.dataset.dynamic==='createType'&&values.createType==='new'){m.values.currentVersion='';m.values.product='';m.values.targetVersion='V1.0'}
 if(el.dataset.dynamic==='createType'&&values.createType==='iteration'){m.values.product='';m.values.currentVersion='';m.values.targetVersion=''}
 if(el.dataset.dynamic==='createType'&&['optimization','other'].includes(values.createType)){
  if(!CONTEXT.products.some(p=>p.id===m.values.product))m.values.product='';
  m.values.currentVersion='';m.values.targetVersion='';
 }
 renderModal();
}
function handleAction(el){
 const a=el.dataset.action,id=el.dataset.id,type=el.dataset.type||'requirement';
 if(a==='tab'){view.tab=el.dataset.value;view.page=1;view.source='';view.taskFilter='';view.status='';view.kind='';view.gate='';if(view.tab==='requirements'){view.search='';view.line='';view.owner=''}render();const list=ROOT.querySelector('#main-list');list.scrollTop=0;list.scrollLeft=0}
 else if(a==='stat'){const target=['review','materials'].includes(el.dataset.value)?'packages':'todo';const taskFilter=view.tab===target&&view.taskFilter===el.dataset.value?'':el.dataset.value;Object.assign(view,{tab:target,taskFilter,search:'',line:'',owner:'',source:'',status:'',kind:'',gate:'',page:1});render()}
 else if(a==='clear-filter'){Object.assign(view,{search:'',line:'',owner:'',source:'',status:'',kind:'',gate:'',taskFilter:'',page:1});render()}
 else if(a==='page'){view.page+=Number(el.dataset.value);render()}
 else if(a==='detail')openDetail(type,id);
 else if(a==='task'){const category=el.dataset.category;openDetail(type,id,type==='package'?(category==='sync'||category==='accept'?'links':'review'):'overview');if(category==='transaction')openModal('transaction',{id})}
 else if(a==='close-detail')closeDetail();
 else if(a==='back-detail')backDetail();
 else if(a==='detail-tab'){view.detail.tab=el.dataset.value;view.detail.scroll=0;renderDrawer();ROOT.querySelector('.drawer-body').scrollTop=0}
 else if(a==='gate'){view.detail.gate=Number(el.dataset.value);renderDrawer()}
 else if(a==='create')openModal('create',{packageId:el.dataset.package||''});
 else if(a==='close-modal')closeModal();
 else if(a==='priority-help')openPriorityHelp();
 else if(a==='close-priority')ROOT.querySelector('#priority-dialog').close();
 else if(a==='group')openModal('group',{ids:el.dataset.ids?el.dataset.ids.split(','):undefined,packageId:el.dataset.package||''});
 else if(a==='tx-package')openModal('tx-package',{ids:[...view.txSelected]});
 else if(a==='tx-add-detail')openModal('tx-add-detail',{id});
 else if(a==='wizard-back'){const m=view.modal;m.values={...m.values,...readForm()};if(m.step===2)m.ids.forEach(id=>m.scopes[id]={scope:m.values['scope_'+id]||'',acceptance:m.values['acceptance_'+id]||''});m.step=Math.max(0,m.step-1);renderModal()}
 else if(a==='review-detail')openDetail('review',id);
 else if(a==='preview')openModal('preview',{id,reviewId:el.dataset.review});
 else if(['edit-requirement','edit-package','assign','opinion','conclusion','release','withdraw','correction','freeze','move','confirm-change','transaction','tx-accept','tx-version','tx-package-accept','tx-package-version','local-progress','project-progress','accept','planning-admission','package-to-transaction','tx-package-progress'].includes(a))openModal(a,{id,type});
 else if(a==='material')openModal(a,{id,gate:Number(el.dataset.gate),category:el.dataset.category});
 else if(a==='start-review')openModal(a,{id,gate:Number(el.dataset.gate)});
 else if(a==='condition')openModal(a,{id,index:Number(el.dataset.index)});
 else if(a==='baseline')openModal(a,{id,history:el.dataset.history==='true'});
 else if(a==='lifecycle')openModal(a,{id,type,mode:el.dataset.mode});
 else if(a==='candidate'){const p=pkgById(id);if(!p||!isDevelopmentKind(p.kind))fail('此类型不纳入产品规划');if(!p.external.plan){p.external.plan={id:'PLAN-'+p.id.slice(4),status:'candidate',syncStatus:'idle',planned:day(65)};audit('package',id,'关联候选规划',p.external.plan.id);commit();toast('已建立候选规划关联，尚未创建项目')}}
 else if(a==='retry')syncPackage(id,el.dataset.op||'admit');
 else if(a==='cancel-change'){cancelChange(id);toast('待确认变更已取消')}
 else if(a==='feedback'){
  const p=pkgById(id);if(p.external.project?.status!=='complete')fail('请等待项目完成并按明细确认实现情况');
  if(!members(p).length||members(p).some(r=>!r.fulfilled))fail('仍有需求未验收，请逐项确认实现情况');
  p.feedbackStatus='已回写';members(p).forEach(r=>r.feedbackProgress='已实现，等待反馈系统判断原始反馈闭环');
  audit('package',p.id,'回写反馈处理进展',members(p).length+' 条需求已确认实现；原始反馈是否关闭由反馈系统判断');commit();toast('已模拟回写需求归属与实现进展');
 }else if(a==='reset')openModal('reset');
 else if(a==='select-all'){
  ROOT.querySelectorAll('#main-list input[data-select]:not(:disabled)').forEach(c=>{if(el.checked)view.selected.add(c.dataset.select);else view.selected.delete(c.dataset.select)});render();
 }else if(a==='tx-select-all'){
  ROOT.querySelectorAll('#main-list input[data-tx-select]:not(:disabled)').forEach(c=>{if(el.checked)view.txSelected.add(c.dataset.txSelect);else view.txSelected.delete(c.dataset.txSelect)});render();
 }
}
ROOT.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;try{handleAction(el)}catch(err){toast(err.message)}});
ROOT.addEventListener('input',event=>{if(event.target.id==='search-input'){view.search=event.target.value;view.page=1;render()}});
ROOT.addEventListener('change',event=>{
 const el=event.target;
 if(el.dataset.filter){view[el.dataset.filter]=el.value;view.page=1;render()}
 if(el.dataset.select){if(el.checked)view.selected.add(el.dataset.select);else view.selected.delete(el.dataset.select);render()}
 if(el.dataset.txSelect){if(el.checked)view.txSelected.add(el.dataset.txSelect);else view.txSelected.delete(el.dataset.txSelect);render()}
 if(el.dataset.dynamic)dynamicForm(el);
 if(el.dataset.failNext){pkgById(el.dataset.failNext).failNext=el.checked;persist()}
});
ROOT.addEventListener('submit',event=>{if(event.target.id==='business-form')submitModal(event)});
ROOT.querySelector('#detail-drawer').addEventListener('cancel',()=>{view.detail=null;view.detailStack=[]});
ROOT.querySelector('#business-dialog').addEventListener('cancel',()=>{view.modal=null});
ROOT.querySelector('#priority-dialog').addEventListener('cancel',event=>event.currentTarget.close());
ROOT.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=I(el.dataset.icon));
window.TerminalRequirementsPrototype=Object.freeze({snapshot:()=>clone(state),context:()=>clone(CONTEXT)});
render();
if(storageIssue)toast('原演示存储无法读取，已加载临时案例；确认重置后可恢复保存。');
})();
</script>
